<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<title>宣传展示</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">品牌宣传展示</span>
    </div>
    <div class="clock-wrap">
      <div class="date" id="date">--</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </header>

  <main class="main">
    <section class="media-stage">
      <div class="media-layer" id="layer-a"></div>
      <div class="media-layer" id="layer-b"></div>
      <div class="media-badge" id="media-badge">加载中</div>
    </section>

    <aside class="panels" id="panels"></aside>
  </main>

  <footer class="ticker">
    <div class="ticker-label">
      <span class="ticker-dot"></span>公告
    </div>
    <div class="ticker-viewport">
      <div class="ticker-track" id="ticker-track">
        <span id="subtitle">加载中...</span>
        <span id="subtitle-copy">加载中...</span>
      </div>
    </div>
  </footer>

</div>
<script src="./js/main.js"></script>
</body>
</html>
